<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Fondo amarillo cálido corporativo Incognito -->
    <linearGradient id="incYellowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#facc15" />
      <stop offset="85%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Cara superior del bloque isométrico -->
    <linearGradient id="incTopFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#525f75" />
      <stop offset="100%" stop-color="#3d495c" />
    </linearGradient>

    <!-- Cara izquierda del bloque (sombra) -->
    <linearGradient id="incLeftFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#242c38" />
      <stop offset="100%" stop-color="#181f2a" />
    </linearGradient>

    <!-- Cara derecha del bloque (medio tono) -->
    <linearGradient id="incRightFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b4657" />
      <stop offset="100%" stop-color="#2a3341" />
    </linearGradient>

    <!-- Color de las perforaciones amarillas de la cara superior -->
    <linearGradient id="incHoleYellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- 1. Cuadrado contenedor amarillo con esquinas redondeadas -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="url(#incYellowBg)" />

  <!-- 2. Cara Lateral Izquierda con muesca/patas -->
  <path d="M 22 43 L 50 63 L 50 77 L 44 73 L 44 67 L 31 58 L 31 63 L 22 56 Z"
        fill="url(#incLeftFace)" />

  <!-- 3. Cara Lateral Derecha con muesca/patas -->
  <path d="M 50 63 L 78 43 L 78 56 L 69 63 L 69 58 L 56 67 L 56 73 L 50 77 Z"
        fill="url(#incRightFace)" />

  <!-- 4. Cara Superior Isométrica -->
  <polygon points="50,23 78,43 50,63 22,43"
           fill="url(#incTopFace)" />

  <!-- 5. Las 4 Perforaciones Isométricas en la cara superior (Grid 2x2) -->
  <!-- Perforación 1 (Superior) -->
  <polygon points="50,28.5 58,34.5 50,40.5 42,34.5"
           fill="url(#incHoleYellow)" />

  <!-- Perforación 2 (Izquierda) -->
  <polygon points="36,38.5 44,44.5 36,50.5 28,44.5"
           fill="url(#incHoleYellow)" />

  <!-- Perforación 3 (Derecha) -->
  <polygon points="64,38.5 72,44.5 64,50.5 56,44.5"
           fill="url(#incHoleYellow)" />

  <!-- Perforación 4 (Inferior) -->
  <polygon points="50,48.5 58,54.5 50,60.5 42,54.5"
           fill="url(#incHoleYellow)" />
</svg>

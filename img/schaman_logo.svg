<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradiente amarillo cálido y brillante para Schaman -->
    <linearGradient id="schamanYellowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#facc15" />
      <stop offset="85%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
  </defs>

  <!-- 1. Cuadrado Superior Central -->
  <rect x="46.8" y="5.8" width="17.9" height="17.9" rx="2" fill="url(#schamanYellowGrad)" />

  <!-- 2. Rombo Superior Derecho (45°) -->
  <polygon points="78.2,11.4 89.9,23.1 78.2,34.8 66.5,23.1" fill="url(#schamanYellowGrad)" />

  <!-- 3. Rombo Superior Izquierdo (45°) -->
  <polygon points="32.1,11.4 43.8,23.1 32.1,34.8 20.4,23.1" fill="url(#schamanYellowGrad)" />

  <!-- 4. Cuadrado Lateral Izquierdo -->
  <rect x="14.8" y="32.7" width="16.6" height="16.6" rx="2" fill="url(#schamanYellowGrad)" />

  <!-- 5. Rombo Inferior Izquierdo (45°) -->
  <polygon points="32.1,48.5 43.8,60.2 32.1,71.9 20.4,60.2" fill="url(#schamanYellowGrad)" />

  <!-- 6. Cuadrado Central / Base del bucle superior -->
  <rect x="46.8" y="60.9" width="17.9" height="17.9" rx="2" fill="url(#schamanYellowGrad)" />

  <!-- 7. Círculo Central Interno del bucle superior -->
  <circle cx="55.8" cy="41.7" r="8.7" fill="url(#schamanYellowGrad)" />

  <!-- 8 a 12. Cadena de círculos del bucle inferior formando la 'S' -->
  <circle cx="75.0" cy="46.8" r="7.7" fill="url(#schamanYellowGrad)" />
  <circle cx="85.2" cy="67.3" r="8.3" fill="url(#schamanYellowGrad)" />
  <circle cx="76.2" cy="87.8" r="8.3" fill="url(#schamanYellowGrad)" />
  <circle cx="55.8" cy="94.2" r="8.7" fill="url(#schamanYellowGrad)" />
  <circle cx="35.3" cy="87.8" r="8.3" fill="url(#schamanYellowGrad)" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradiente para el fondo oscuro redondeado -->
    <linearGradient id="dashBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#26282e" />
      <stop offset="100%" stop-color="#141518" />
    </linearGradient>

    <!-- Gradiente para el arco gris izquierdo -->
    <linearGradient id="dashGrayGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#9ca3af" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Gradiente para el arco celeste derecho -->
    <linearGradient id="dashBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>

  <!-- Cuadrado oscuro redondeado de fondo -->
  <rect x="2" y="2" width="96" height="96" rx="20" fill="url(#dashBgGrad)" stroke="#333740" stroke-width="2" />

  <!-- 1. Arco Izquierdo (Gris) -->
  <path d="M 28.2 81.13 A 38.0 38.0 0 0 1 17.09 31.0 L 30.95 39.0 A 22.0 22.0 0 0 0 37.38 68.02 Z"
        fill="url(#dashGrayGrad)" />

  <!-- 2. Arco Superior (Blanco Brillante) -->
  <path d="M 17.09 31.0 A 38.0 38.0 0 0 1 76.87 23.13 L 65.56 34.44 A 22.0 22.0 0 0 0 30.95 39.0 Z"
        fill="#ffffff" />

  <!-- 3. Arco Derecho (Celeste / Azul Cyan) -->
  <path d="M 76.87 23.13 A 38.0 38.0 0 0 1 71.8 81.13 L 62.62 68.02 A 22.0 22.0 0 0 0 65.56 34.44 Z"
        fill="url(#dashBlueGrad)" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Gradiente Rojo Claro Oficial -->
    <linearGradient id="claroRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef1e2b" />
      <stop offset="60%" stop-color="#da291c" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
  </defs>

  <!-- Círculo Rojo Oficial de Fondo -->
  <circle cx="50" cy="50" r="48" fill="url(#claroRedGrad)" />

  <!-- 1. Letra 'C' -->
  <path d="M 28.5 44.2 C 27 42.5 24.8 41.5 22 41.5 C 16.8 41.5 13 45.2 13 50.5 C 13 55.8 16.8 59.5 22 59.5 C 24.8 59.5 27 58.5 28.5 56.8 L 26.2 54 C 25.2 55.2 23.8 56 22 56 C 18.8 56 16.5 53.5 16.5 50.5 C 16.5 47.5 18.8 45 22 45 C 23.8 45 25.2 45.8 26.2 47 Z"
        fill="#ffffff" />

  <!-- 2. Letra 'l' -->
  <rect x="30" y="34.5" width="3.4" height="24.5" rx="0.8" fill="#ffffff" />

  <!-- 3. Letra 'a' -->
  <path d="M 45 44 V 59 H 41.8 V 57.2 C 40.8 58.5 39 59.5 37 59.5 C 33.8 59.5 31.5 57 31.5 53.6 C 31.5 50.2 34 48 38.5 48 H 41.8 V 47.2 C 41.8 45.8 40.8 44.8 38.8 44.8 C 37.2 44.8 35.8 45.4 34.6 46.4 L 33.2 43.8 C 34.8 42.4 37 41.6 39.5 41.6 C 43.2 41.6 45 43.2 45 46.5 Z M 41.8 50.6 H 39 C 36.5 50.6 35 51.8 35 53.6 C 35 55.4 36.5 56.6 38.2 56.6 C 40.4 56.6 41.8 55 41.8 53 Z"
        fill="#ffffff" />

  <!-- 4. Letra 'r' -->
  <path d="M 47.5 42 H 50.8 V 44.6 C 51.8 42.8 53.6 41.6 55.8 41.6 C 56.5 41.6 57.2 41.8 57.8 42.1 L 56.5 45.2 C 55.9 44.9 55.3 44.8 54.8 44.8 C 52.6 44.8 50.8 46.5 50.8 49.5 V 59 H 47.5 Z"
        fill="#ffffff" />

  <!-- 5. Letra 'o' -->
  <path d="M 64.5 41.6 C 69.5 41.6 73.5 45.5 73.5 50.5 C 73.5 55.5 69.5 59.5 64.5 59.5 C 59.5 59.5 55.5 55.5 55.5 50.5 C 55.5 45.5 59.5 41.6 64.5 41.6 Z M 64.5 45 C 61.5 45 59.2 47.4 59.2 50.5 C 59.2 53.6 61.5 56 64.5 56 C 67.5 56 69.8 53.6 69.8 50.5 C 69.8 47.4 67.5 45 64.5 45 Z"

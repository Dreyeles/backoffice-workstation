  <!-- 6. Los 3 Rayos del Sol Oficial de Claro sobre la 'o' -->
  <!-- Rayo Superior (12h) -->
  <line x1="64.5" y1="35" x2="64.5" y2="39"
        stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" />

  <!-- Rayo Diagonal (13h30 / 45°) -->
  <line x1="71" y1="44" x2="74.5" y2="40.5"
        stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" />

  <!-- Rayo Derecho (15h) -->
  <line x1="75.5" y1="50.5" x2="79.5" y2="50.5"
        stroke="#ffffff" stroke-width="3.4" stroke-linecap="round" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Gradiente para el cuerpo de la nube (azul a celeste) -->
    <linearGradient id="huaweiCloudGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1d4ed8" />
      <stop offset="30%" stop-color="#2563eb" />
      <stop offset="70%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Gradiente para el lazo de comunicación inteligente (celeste a violeta) -->
    <linearGradient id="huaweiLoopGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="30%" stop-color="#2563eb" />
      <stop offset="65%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
  </defs>

  <!-- Trazo Izquierdo y Superior: Silueta Nube -->
  <path d="M 40 74 C 29 74 21 65 21 52.5 C 21 41 29 33.5 38 31.5 C 40 17.5 55 12 68 18 C 73.5 21 77.5 26 79.5 32.5"
        stroke="url(#huaweiCloudGrad)"
        stroke-width="11"
        stroke-linecap="round"
        stroke-linejoin="round" />

  <!-- Trazo Derecho: Nodo de Comunicación / Lazo Inteligente ICC -->
  <path d="M 50 67 C 47.5 54 53 39 68 39 C 81 39 88 48 88 59 C 88 71 78 77 64 77 L 55 77"
        stroke="url(#huaweiLoopGrad)"
        stroke-width="11"
        stroke-linecap="round"
        stroke-linejoin="round" />
</svg>
